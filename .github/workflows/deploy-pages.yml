# Deploy the read-only East Sound showcase to GitHub Pages.
#
# GitHub Pages cannot run the Node server (API routes, SSR, the .data store),
# so this builds a static export via scripts/build-static.sh and publishes it.
# The full app with uploads + persistence should run on a Node host
# with durable storage; Vercel defaults to safe public-reference mode.
# This workflow publishes the read-only static showcase.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["arena/**", main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate types, lint and unit tests
        run: npm run typecheck && npm run lint && npm test

      - name: Validate PostgreSQL transactions and worker concurrency
        run: npm run test:postgres

      - name: Build static export
        run: bash scripts/build-static.sh
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .static-build/out

  deploy:
    # GitHub Pages only permits deploys from the default branch. Pushes to the
    # working branch still run `build` (verifying the export compiles) but must
    # not attempt a deploy that the environment protection rules will reject.
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
