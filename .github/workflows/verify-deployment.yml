name: Verify Vercel deployment

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS Vercel URL to verify (no credentials)
        required: true
        type: string
      expected_commit:
        description: Expected deployed Git commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify live routes and non-mutating browser workflows
        run: npm run test:deployment
        env:
          EAST_SOUND_TEST_URL: ${{ inputs.base_url }}
          EAST_SOUND_EXPECT_COMMIT: ${{ inputs.expected_commit }}
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-smoke-diagnostics
          path: .data/qa/deployment-results/
          retention-days: 3
